# HRMD Leave Tally Sheet: production stack for one office server.
#
#   cp .env.docker.example .env      # then edit it
#   docker compose up -d --build
#   docker compose exec app php artisan hrmd:install
#
# Full steps: "Install with Docker" in README.md.
name: hrmd

# Settings every app container shares. Values from .env are loaded first;
# these win, so a copied dev .env can never switch production into debug mode.
x-app-environment: &app-environment
  APP_ENV: production
  APP_DEBUG: "false"
  LOG_CHANNEL: stderr
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: "5432"

services:
  app:
    build: .
    image: hrmd-tallysheet:latest
    restart: unless-stopped
    env_file: .env
    environment: *app-environment
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy

  # Background jobs (large PDF/Excel exports, Phase 7). Idle until there are jobs.
  queue:
    image: hrmd-tallysheet:latest
    restart: unless-stopped
    env_file: .env
    environment: *app-environment
    user: www-data
    command: ["php", "artisan", "queue:work", "--tries=1", "--sleep=3", "--max-time=3600"]
    # The image's health check calls the web server, which this container doesn't run.
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE in .env}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TZ: ${APP_TIMEZONE:-Asia/Manila}
    volumes:
      - db-data:/var/lib/postgresql/data
    # No "ports:" on purpose: only the app container can reach the database,
    # never another PC on the network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  # One pg_dump per day into ./backups, kept for BACKUP_KEEP_DAYS days.
  # Copy that folder off this machine regularly: a dead disk takes it too.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGDATABASE: ${DB_DATABASE}
      PGUSER: ${DB_USERNAME}
      PGPASSWORD: ${DB_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      TZ: ${APP_TIMEZONE:-Asia/Manila}
    volumes:
      - ./backups:/backups
      - ./docker/backup.sh:/usr/local/bin/hrmd-backup.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/hrmd-backup.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
