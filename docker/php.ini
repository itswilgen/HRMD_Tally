; HRMD overrides on top of php.ini-production.
expose_php = Off
memory_limit = 512M
; Masterlist imports (.xlsx / .csv) go through an upload.
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 120

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; The code only changes when a new image is built.
opcache.validate_timestamps = 0
