name: backend

# Pint, Larastan and the Pest suite against a real PostgreSQL, exactly as
# `composer run check` runs them locally, plus a dependency audit
# (docs/SECURITY.md, rule 10).

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          # The test guard in tests/TestCase.php only runs against a
          # database whose name ends in _testing.
          POSTGRES_DB: hrmd_tallysheet_testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, gd, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      # The pages are rendered through the Vite manifest during tests.
      - name: Build assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Dependency audit
        run: composer audit

      # The same three checks as `composer run check`, as separate steps so
      # the failing one is named, each reporting its problems as annotations
      # on the pull request instead of only in the log.
      - name: Pint
        run: vendor/bin/pint --test

      - name: Larastan
        run: vendor/bin/phpstan analyse --memory-limit=1G --error-format=github

      - name: Pest
        run: php artisan test --log-junit junit.xml

      - name: Name the failing tests
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          if not os.path.exists('junit.xml'):
              raise SystemExit(0)

          def clean(text):
              return text.replace('%', '%25').replace('\r', '').replace('\n', '%0A')

          for case in ET.parse('junit.xml').getroot().iter('testcase'):
              for problem in case.findall('failure') + case.findall('error'):
                  detail = (problem.text or problem.get('message') or '').strip()
                  print(f"::error title={clean(case.get('class') or case.get('file') or 'test')}::{clean(case.get('name', '') + ': ' + detail[:1500])}")
          PY
