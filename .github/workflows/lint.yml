name: frontend

# TypeScript, ESLint and Prettier, read-only: CI fails on a problem instead
# of rewriting the code behind your back.

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # app.tsx imports ziggy-js from the Composer package.
      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress --no-scripts
          npm ci

      - name: Types
        run: npm run types

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check
